[project]
name = "rag-system"
version = "0.1.0"
description = "Local Retrieval-Augmented Generation chatbot over PDF/TXT documents (CS311 final project)"
readme = "../README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.2",
    "langchain-ollama>=0.3",
    "chromadb>=0.5",
    "pypdf>=5.0",
    "streamlit>=1.37.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
