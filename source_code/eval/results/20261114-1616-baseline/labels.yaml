# Hand labels for the baseline run.
#
#   correct     answers the question and agrees with the handbook (small harmless
#               extra detail is OK)
#   incomplete  what it says is right, but key parts of the answer are missing
#   incorrect   wrong, answers a different question, or invents facts
#   ambiguous   mixes correct and wrong statements, or is faithful to a source that
#               is itself wrong, so a reader can't tell what is true
#
# Format: <question id>: { <model>: [label, "reason"] }

req-major-credits:
  qwen2.5:0.5b: [incorrect, "Describes the declaration rule and the MINOR requirements; never gives 56."]
  qwen2.5:1.5b: [correct, "56 is right. Its shown arithmetic (4+4+4+4+3x4+16) actually sums to 44 - it drops CS302 and the capstone - but the final number is copied from the text."]
  qwen2.5:3b: [correct, "56 is right; 'exploratory courses and electives' as part of the 56 is loosely worded."]

